version: 1
warehouse:
  provider: bigquery
  billing_model: on_demand
  billing_project: analytics-ci
  location: US
  price_per_tib_usd: "6.25" # Example only: set your current user-owned gross rate.
frequencies:
  default_runs_per_month: null
