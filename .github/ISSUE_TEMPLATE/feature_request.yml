name: Feature request
description: Propose a narrowly scoped user outcome
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pre-merge cost-review job cannot you complete today?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable behavior, not an implementation mandate.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Unknowns and security impact
      description: Could this affect dry-run-only behavior, SQL privacy, credentials, or fail-closed handling?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I reviewed the roadmap and this is not a request for synthetic accuracy claims.
          required: true
