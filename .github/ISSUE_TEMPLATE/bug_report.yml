name: Bug report
description: Report reproducible incorrect or unexpected behavior
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Never paste credentials, raw production SQL, production manifests, client names, or raw
        provider errors. Use synthetic data. Report vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: queryspend version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Python API
        - GitHub Action
        - BigQuery provider
        - Renderer or schema
        - Documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and sanitized output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      placeholder: Exact commands and the smallest safe fixture.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Ubuntu 24.04, Python 3.13, dbt manifest v12"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, raw SQL, production identifiers, and client data.
          required: true
        - label: This is not a privately reportable security vulnerability.
          required: true
